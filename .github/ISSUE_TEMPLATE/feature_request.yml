name: Feature Request
description: Suggest a new feature for Fabla
title: '[FEATURE] '
labels: ['feature']
assignees: ['BuchiNy', 'Wiza-Munthali', 'carol-kadza']
body:
  - type: markdown
    attributes:
      value: |
        This Feature Request form is used to suggest new feature for Fabla

  - type: textarea
    id: feature-description
    attributes:
      label: 💡 Feature Description
      description: A clear description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: 🎯 Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 💭 Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: mockups-examples
    attributes:
      label: 📱 Mockups/Examples
      description: Add any mockups, examples, or references.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: List the criteria that must be met for this feature to be considered complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 📎 Additional Context
      description: Add any other context about the feature request here.
    validations:
      required: false