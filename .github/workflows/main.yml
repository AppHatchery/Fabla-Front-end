name: Flutter Test on Push/PR (main, Dev)

on:
  push:
    branches:
      - main
      - Dev
  pull_request:
    branches:
      - main
      - Dev

jobs:
  tests:
    runs-on: ubuntu-latest

    steps: 
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install junitreport
        run: dart pub global activate junitreport

      - name: Ensure directories exist
        run: |
          mkdir -p build/reports
          mkdir -p test/failures
          touch build/reports/.keep
          touch test/failures/.keep

      - name: Run tests and generate report
        run: 
          flutter test test/ --verbose
        timeout-minutes: 10
