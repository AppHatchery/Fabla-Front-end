name: Flutter Test on Push/PR (main, Dev)

on:
  push:
    branches:
      - main
      - Dev
  pull_request:
    branches:
      - main
      - Dev

jobs:
  tests:
    runs-on: ubuntu-latest

    steps: 
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install junitreport
        run: dart pub global activate junitreport

      - name: Run tests and generate report
        run: |
          flutter test --machine > test_output.json
          dart pub global run junitreport:tojunit --input test_output.json --output build/reports/junit.xml
        timeout-minutes: 10

      - name: Ensure test report directories exist
        run: |
          mkdir -p build/reports/
          mkdir -p test/failures/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/
            test/failures/
          retention-days: 7
