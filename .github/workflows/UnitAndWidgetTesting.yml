name: Unit and Widget Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true # caches the Flutter SDK itself between runs

      - name: Cache pub & dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create .env from secrets
        run: |
          # Check for hardcoded secrets (basic check)
          if grep -r "password\|secret\|key\|token" --include="*.dart" lib/ --exclude-dir=secrets; then
            echo "⚠️ Potential hardcoded secrets found"
            # Don't fail the build, just warn
          fi 
          # Check dependencies for known vulnerabilities
          flutter pub deps --json > deps.json
          echo "✅ Dependency check completed"

  tests:
    needs: Qaulity_and_test_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-
          echo "APIKEY=${{ secrets.APIKEY }}" > .env
          echo "PENDOKEY=${{ secrets.PENDOKEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test test/
        timeout-minutes: 10
