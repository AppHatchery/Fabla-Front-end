name: Test & Deploy Debug

# PRs validate the proposed merge (required check; main is branch-protected).
# workflow_dispatch allows manual re-runs from the Actions tab (flake triage,
# post-secret-rotation).
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'
  RUBY_VERSION: '3.3.6'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    branches:
      - main
  workflow_dispatch:

# Needed so the workflow can post/update the results comment on the PR.
permissions:
  contents: read
  pull-requests: write

  #cancel superseded runs on the same PR instead of stacking them.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIN_COVERAGE: "18"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true # caches the Flutter SDK itself between runs

      - name: Cache pub & dart_tool
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create .env from secrets
        # Secrets aren't auto-exposed as shell vars
        env:
          APIKEY: ${{ secrets.APIKEY }}
          PENDOKEY: ${{ secrets.PENDOKEY }}
        run: |
          printf 'APIKEY=%s\n' "$APIKEY" > .env
          printf 'PENDOKEY=%s\n' "$PENDOKEY" >> .env

      - run: flutter pub get

      - name: Create dummy keys
        run: |
          mkdir -p lib/core/secrets
          cat > lib/core/secrets/keys.dart << 'KEYS'
          const apiKey = 'dummy';
          const pendoKey = 'dummy';
          KEYS

      - name: Cache build_runner output
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter test test/
        timeout-minutes: 10

  deploy_debug:
    if: contains(github.event.pull_request.title, '[deploy]')
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27*
          sudo apt-get clean

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # Cache Android SDK platforms, NDK, cmake, and build-tools
      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/cmake
          key: ${{ runner.os }}-android-sdk-v2
          restore-keys: ${{ runner.os }}-android-sdk-

      # Pre-install SDK components so Gradle doesn't download mid-build
      - name: Install required SDK components
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          $SDKMANAGER --install \
            "platforms;android-36" \
            "platforms;android-33" \
            "platforms;android-31" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358" 2>/dev/null || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: android

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Create dummy keys
        run: |
          mkdir -p lib/core/secrets
          cat > lib/core/secrets/keys.dart << 'KEYS'
          const apiKey = 'dummy';
          const pendoKey = 'dummy';
          KEYS

      # Only cache Gradle dependencies, not build output
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-deps-

      - name: Cache build_runner output
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Bump build number
        working-directory: android
        run: bundle exec fastlane bump_build_number

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.vfs.watch=false"
        run: flutter build apk --debug --target-platform android-arm64 --tree-shake-icons

      - name: Deploy to Firebase via Fastlane
        working-directory: android
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bundle exec fastlane deploy_to_firebase
      - name: Generate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs

      # The `github` reporter annotates failing tests inline in the run log and
      # folds output into groups; the `json` file-reporter is parsed afterwards
      # for the step summary and PR comment. continue-on-error lets the summary
      # and comment steps run even when tests fail — the gate step fails the job.
      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        timeout-minutes: 10
        run: |
          flutter test --coverage test/ \
            --reporter github \
            --file-reporter "json:test-results.json"

      # `!cancelled()`: run on test failure so results still get
      # reported, but respect cancel-in-progress — a superseded run must not keep
      # burning minutes or overwrite the newer run's PR comment.
      - name: Compute in-scope coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y lcov
          COVERAGE="0"
          LINES=""
          if [ -f coverage/lcov.info ]; then
            lcov --remove coverage/lcov.info \
              'lib/**/*.g.dart' \
              'lib/**/*.freezed.dart' \
              'lib/objectbox.g.dart' \
              'lib/main.dart' \
              'lib/firebase_options.dart' \
              'lib/theme/**' \
              'lib/core/utils/dummy_data.dart' \
              'lib/core/utils/errorCodes.dart' \
              'lib/core/utils/emailFunction.dart' \
              -o coverage/lcov.info --ignore-errors unused
            SUMMARY=$(lcov --summary coverage/lcov.info 2>&1)
            COVERAGE=$(echo "$SUMMARY" \
              | grep -oP 'lines.*: \K[0-9.]+(?=%)' || echo "0")
            LINES=$(echo "$SUMMARY" \
              | grep -oP 'lines.*\(\K[0-9]+ of [0-9]+(?= lines\))' || echo "")
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVERAGE% (gate ${MIN_COVERAGE}%)"

      # Build two Markdown reports: report.md (concise — sticky PR comment) and
      # summary.md (extended — run details, slowest tests, per-file breakdown)
      # for the Actions run Summary page. Counts are exposed as step outputs.
      - name: Build test report
        id: report
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/test_summary.py \
            test-results.json report.md \
            "${{ steps.coverage.outputs.coverage }}" "${MIN_COVERAGE}" \
            --summary-out summary.md \
            --lines "${{ steps.coverage.outputs.lines }}" \
            >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Upsert a single sticky comment on the PR (first-party github-script, no
      # third-party action). Matched by the hidden marker so re-runs update it.
      - name: Comment results on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- unit-widget-tests -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      # Single place the job actually fails: tests must pass AND coverage must
      # meet the gate. Reasons are emitted as ::error:: annotations.
      - name: Enforce results and coverage gate
        if: ${{ !cancelled() }}
        run: |
          ok=1
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::${{ steps.report.outputs.failed }} test(s) failed — see the job summary and PR comment."
            ok=0
          fi
          COVERAGE="${{ steps.coverage.outputs.coverage }}"
          if ! awk "BEGIN {exit !($COVERAGE >= $MIN_COVERAGE)}"; then
            echo "::error::Coverage $COVERAGE% is below the gate of ${MIN_COVERAGE}%."
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then
            exit 1
          fi
          echo "All tests passed; coverage $COVERAGE% >= ${MIN_COVERAGE}%."
