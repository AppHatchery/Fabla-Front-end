name: Unit and Widget Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true # caches the Flutter SDK itself between runs

      - name: Cache pub & dart_tool
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create .env from secrets
        run: |
          echo "APIKEY=${{ secrets.APIKEY }}" > .env
          echo "PENDOKEY=${{ secrets.PENDOKEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage test/
        timeout-minutes: 10

      - name: Enforce coverage threshold
        run: |
          sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info \
            'lib/**/*.g.dart' \
            'lib/**/*.freezed.dart' \
            'lib/objectbox.g.dart' \
            'lib/main.dart' \
            'lib/firebase_options.dart' \
            'lib/theme/**' \
            'lib/core/utils/dummy_data.dart' \
            'lib/core/utils/errorCodes.dart' \
            'lib/core/utils/emailFunction.dart' \
            -o coverage/lcov.info --ignore-errors unused
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep -oP 'lines.*: \K[0-9.]+(?=%)')
          echo "Coverage: $COVERAGE%"
          awk "BEGIN {exit !($COVERAGE >= 17)}" || { echo "Coverage below 17%"; exit 1; }