name: Unit and Widget Tests

# PRs validate the proposed merge (required check; main is branch-protected).
# workflow_dispatch allows manual re-runs from the Actions tab (flake triage,
# post-secret-rotation). The coverage, report and gate steps run scripts in
# .github/scripts/tests/.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Needed so the workflow can post/update the results comment on the PR.
permissions:
  contents: read
  pull-requests: write

  #cancel superseded runs on the same PR instead of stacking them.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  test:
    # This name is the heading the full details appear under on the run
    # Summary page.
    name: Test Results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIN_COVERAGE: "24"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true # caches the Flutter SDK itself between runs

      - name: Cache pub & dart_tool
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create .env from secrets
        # Secrets aren't auto-exposed as shell vars
        env:
          APIKEY: ${{ secrets.APIKEY }}
          PENDOKEY: ${{ secrets.PENDOKEY }}
        run: |
          printf 'APIKEY=%s\n' "$APIKEY" > .env
          printf 'PENDOKEY=%s\n' "$PENDOKEY" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs

      # The `github` reporter annotates failing tests inline in the run log and
      # folds output into groups; the `json` file-reporter is parsed afterwards
      # for the step summary and PR comment. continue-on-error lets the summary
      # and comment steps run even when tests fail — the gate step fails the job.
      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        timeout-minutes: 10
        run: |
          flutter test --coverage test/ \
            --reporter github \
            --file-reporter "json:test-results.json"

      # `!cancelled()`: run on test failure so results still get
      # reported, but respect cancel-in-progress — a superseded run must not keep
      # burning minutes or overwrite the newer run's PR comment.
      - name: Compute in-scope coverage
        if: ${{ !cancelled() }}
        run: bash .github/scripts/tests/test_coverage.sh

      - name: Build test report
        if: ${{ !cancelled() }}
        run: bash .github/scripts/tests/test_report.sh

      # Upsert a single sticky comment on the PR. The shared helper handles
      # pagination, null comment bodies, the 65536-character limit and the
      # read-only token a fork PR gets — see .github/scripts/upsert_pr_comment.js
      - name: Comment results on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const upsert = require('.github/scripts/upsert_pr_comment.js');
            await upsert({
              github, context, core,
              marker: '<!-- unit-widget-tests -->',
              path: 'report.md',
              fallback: '_Test report was not generated._',
            });

      # The only step that fails the job: tests must pass and coverage must meet
      # MIN_COVERAGE.
      - name: Enforce results and coverage gate
        if: ${{ !cancelled() }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: bash .github/scripts/tests/test_gate.sh
