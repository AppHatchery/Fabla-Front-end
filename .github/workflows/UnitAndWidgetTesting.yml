name: Main workflow

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true  # subosito built-in SDK caching

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Create dummy keys
        run: |
          mkdir -p lib/core/secrets
          cat > lib/core/secrets/keys.dart << 'EOF'
          // Dummy API keys for CI
          const apiKey = 'dummy';
          const pendoKey = 'dummy';
          EOF

      - name: Cache build_runner output
        uses: actions/cache@v3
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter test test/
        timeout-minutes: 10

  deploy:
    runs-on: ubuntu-latest
    needs: tests  # only deploy if tests pass
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - run: flutter pub get

      - name: Cache APK build output
        uses: actions/cache@v3
        id: apk-cache
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          key: ${{ runner.os }}-apk-${{ hashFiles('lib/**/*.dart', 'pubspec.lock', 'android/**/*.gradle') }}

      - name: Build APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          flutter build apk --release \
            --build-name=1.9.16\
            --build-number=2

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
          working-directory: android

      - name: Deploy to Firebase via Fastlane
        working-directory: android
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          CREDENTIAL_FILE_CONTENT: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: bundle exec fastlane deploy_to_firebase