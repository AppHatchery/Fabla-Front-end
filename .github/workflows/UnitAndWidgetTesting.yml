name: Unit and Widget Tests

# PRs validate the proposed merge (required check; main is branch-protected).
# workflow_dispatch allows manual re-runs from the Actions tab (flake triage,
# post-secret-rotation).
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Needed so the workflow can post/update the results comment on the PR.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same PR instead of stacking them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIN_COVERAGE: "18"
      MIN_VALIDATOR_COVERAGE: "85"
      VALIDATOR_DIR: tools/release_validator
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true # caches the Flutter SDK itself between runs

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Create .env from secrets
        # Secrets aren't auto-exposed as shell vars
        env:
          APIKEY: ${{ secrets.APIKEY }}
          PENDOKEY: ${{ secrets.PENDOKEY }}
        run: |
          printf 'APIKEY=%s\n' "$APIKEY" > .env
          printf 'PENDOKEY=%s\n' "$PENDOKEY" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs

      # `lcov` is only needed to strip generated/untestable files from the app's
      # lcov.info. Percentages are computed from the LF/LH records with awk, so
      # nothing depends on lcov's human-readable summary format.
      - name: Install lcov
        run: sudo apt-get install -y lcov

      # Resolved once, up front, so the two validator steps below are
      # independent of each other.
      - name: Install release validator dependencies
        working-directory: ${{ env.VALIDATOR_DIR }}
        run: dart pub get

      # `dart test --coverage=<dir>` writes raw VM hitmaps to <dir>/test/*.json,
      # NOT an lcov.info. format_coverage converts them.
      - name: Run release validator tests with coverage
        id: validator_tests
        continue-on-error: true
        working-directory: ${{ env.VALIDATOR_DIR }}
        run: |
          dart test \
            --coverage=coverage \
            --file-reporter "json:$GITHUB_WORKSPACE/val-results.json"
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib

      # Sums LF (lines found) / LH (lines hit) straight out of lcov.info — one
      # pass over the file, no dependency on lcov's summary wording.
      - name: Compute validator line coverage
        id: validator_coverage
        if: ${{ !cancelled() }}
        working-directory: ${{ env.VALIDATOR_DIR }}
        run: |
          COVERAGE="0"
          LINES=""
          if [ -f coverage/lcov.info ]; then
            read -r COVERAGE LINES <<<"$(awk -F: '
              /^LH:/ { hit += $2 }
              /^LF:/ { found += $2 }
              END { printf "%.2f %d of %d", (found ? hit * 100 / found : 0), hit, found }
            ' coverage/lcov.info)"
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "Validator line coverage: $COVERAGE% ($LINES)" \
            "(gate ${MIN_VALIDATOR_COVERAGE}%)"

      # Separate from the tool's own tests: the schema report must still be
      # written when the tool's unit tests (or its coverage collection) fail.
      # The validator writes the markdown before exiting non-zero, so a real
      # policy violation still produces a report.
      - name: Run ObjectBox schema validation
        id: validator
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ${{ env.VALIDATOR_DIR }}
        run: |
          dart run bin/validator.dart \
            baseline.json \
            "$GITHUB_WORKSPACE/lib/objectbox-model.json" \
            --markdown "$GITHUB_WORKSPACE/validator_report.md"

      # The `github` reporter annotates failing tests inline in the run log and
      # folds output into groups; the `json` file-reporter is parsed afterwards
      # for the step summary and PR comment. continue-on-error lets the summary
      # and comment steps run even when tests fail — the gate step fails the job.
      - name: Run tests with coverage
        id: tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          flutter test --coverage test/ \
            --reporter github \
            --file-reporter "json:test-results.json"

      # `!cancelled()`: run on test failure so results still get
      # reported, but respect cancel-in-progress — a superseded run must not keep
      # burning minutes or overwrite the newer run's PR comment.
      - name: Compute in-scope coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: |
          COVERAGE="0"
          LINES=""
          if [ -f coverage/lcov.info ]; then
            lcov --remove coverage/lcov.info \
              'lib/**/*.g.dart' \
              'lib/**/*.freezed.dart' \
              'lib/objectbox.g.dart' \
              'lib/main.dart' \
              'lib/firebase_options.dart' \
              'lib/theme/**' \
              'lib/core/utils/dummy_data.dart' \
              'lib/core/utils/errorCodes.dart' \
              'lib/core/utils/emailFunction.dart' \
              -o coverage/lcov.info --ignore-errors unused
            read -r COVERAGE LINES <<<"$(awk -F: '
              /^LH:/ { hit += $2 }
              /^LF:/ { found += $2 }
              END { printf "%.2f %d of %d", (found ? hit * 100 / found : 0), hit, found }
            ' coverage/lcov.info)"
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVERAGE% (gate ${MIN_COVERAGE}%)"

      # Build two Markdown reports: report.md (concise — sticky PR comment) and
      # summary.md (extended — run details, slowest tests, per-file breakdown)
      # for the Actions run Summary page. Counts are exposed as step outputs.
      - name: Build test report
        id: report
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/test_summary.py \
            test-results.json report.md \
            "${{ steps.coverage.outputs.coverage }}" "${MIN_COVERAGE}" \
            --summary-out summary.md \
            --lines "${{ steps.coverage.outputs.lines }}" \
            --val-results val-results.json \
            --val-coverage "${{ steps.validator_coverage.outputs.coverage }}" \
            --val-lines "${{ steps.validator_coverage.outputs.lines }}" \
            --val-threshold "${MIN_VALIDATOR_COVERAGE}" \
            --val-report validator_report.md \
            >> "$GITHUB_OUTPUT"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # Upsert a single sticky comment on the PR (first-party github-script, no
      # third-party action). Matched by the hidden marker so re-runs update it.
      - name: Comment results on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- unit-widget-tests -->';
            const body = marker + '\n' + fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      # Single place the job actually fails: validator tests, schema validation,
      # and app tests must all pass AND both coverage gates must be met. Reasons
      # are emitted as ::error:: annotations.
      - name: Enforce results and coverage gate
        if: ${{ !cancelled() }}
        run: |
          ok=1
          if [ "${{ steps.validator_tests.outcome }}" != "success" ]; then
            echo "::error::Release validator tests failed — see the job summary and PR comment."
            ok=0
          fi
          VAL_COVERAGE="${{ steps.validator_coverage.outputs.coverage }}"
          if ! awk "BEGIN {exit !($VAL_COVERAGE >= $MIN_VALIDATOR_COVERAGE)}"; then
            echo "::error::Release validator coverage $VAL_COVERAGE% is below the gate of ${MIN_VALIDATOR_COVERAGE}%."
            ok=0
          fi
          if [ "${{ steps.validator.outcome }}" != "success" ]; then
            echo "::error::Schema validation failed — see the job summary and PR comment."
            ok=0
          fi
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::${{ steps.report.outputs.failed }} test(s) failed — see the job summary and PR comment."
            ok=0
          fi
          COVERAGE="${{ steps.coverage.outputs.coverage }}"
          if ! awk "BEGIN {exit !($COVERAGE >= $MIN_COVERAGE)}"; then
            echo "::error::Coverage $COVERAGE% is below the gate of ${MIN_COVERAGE}%."
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then
            exit 1
          fi
          echo "All tests passed; app coverage $COVERAGE% >= ${MIN_COVERAGE}%," \
            "validator coverage $VAL_COVERAGE% >= ${MIN_VALIDATOR_COVERAGE}%."
