name: Unit and Widget Tests

on:
  pull_request:
    branches:
      - main

#least privilege — this job only reads the repo.
permissions:
  contents: read

#cancel superseded runs on the same PR instead of stacking them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true # caches the Flutter SDK itself between runs

      # cache ONLY ~/.pub-cache. .dart_tool holds build_runner's asset graph and is regenerated cheaply; caching it causes stale/flaky codegen.
      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # pass secrets via env + printf so special chars (" $ ` newline) can't break the file or inject into the script.
      - name: Create .env from secrets
        env:
          APIKEY: ${{ secrets.APIKEY }}
          PENDOKEY: ${{ secrets.PENDOKEY }}
        run: |
          printf 'APIKEY=%s\n' "$APIKEY" > .env
          printf 'PENDOKEY=%s\n' "$PENDOKEY" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage test/
        timeout-minutes: 10

      - name: Enforce coverage threshold
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y lcov

          lcov --remove coverage/lcov.info \
            'lib/**/*.g.dart' \
            'lib/**/*.freezed.dart' \
            'lib/objectbox.g.dart' \
            'lib/main.dart' \
            'lib/firebase_options.dart' \
            'lib/theme/**' \
            'lib/core/utils/dummy_data.dart' \
            'lib/core/utils/errorCodes.dart' \
            'lib/core/utils/emailFunction.dart' \
            -o coverage/lcov.info --ignore-errors unused

          # compute coverage directly from the filtered lcov.info instead of parsing `lcov --summary` text, which changes between lcov 1.x/2.x.
          COVERAGE=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if(f>0) printf "%.1f", h/f*100; else print 0}' coverage/lcov.info)

          if [ -z "$COVERAGE" ]; then
            echo "Failed to compute coverage"
            exit 1
          fi

          echo "Coverage: $COVERAGE%"

          awk "BEGIN {exit !($COVERAGE >= 18)}" || {
            echo "Coverage below 18%"
            exit 1
          }