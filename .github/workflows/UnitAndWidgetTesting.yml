name: Unit and Widget Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true # caches the Flutter SDK itself between runs

      - name: Cache pub & dart_tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create .env from secrets
        run: |
          echo "APIKEY=${{ secrets.APIKEY }}" > .env
          echo "PENDOKEY=${{ secrets.PENDOKEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test test/
        timeout-minutes: 10
